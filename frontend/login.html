<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PP订单管理系统</title>
    <link rel="stylesheet" href="./src/styles/pages/login.css">
    <style>
        /* 启动检测遮罩层 - 防止页面闪烁 */
        .startup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .startup-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .startup-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 24px;
        }
        .startup-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .startup-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- 启动检测遮罩层 -->
    <div id="startup-overlay" class="startup-overlay">
        <div class="startup-logo">PP</div>
        <div class="startup-text">PP订单管理系统</div>
        <div class="startup-spinner"></div>
    </div>

    <div class="login-container" style="opacity: 0; transition: opacity 0.3s ease;">
        <div class="login-left">
            <div class="login-left-content">
                <div class="logo-section">
                    <div class="logo-icon">📄</div>
                    <div class="system-title">PP订单管理系统</div>
                    <div class="system-subtitle">高效 · 智能 · 便捷</div>
                </div>
                <div class="features">
                    <div class="feature-item">
                        <div class="feature-icon">📦</div>
                        <span>全流程订单追踪</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">📊</div>
                        <span>智能数据分析</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🚀</div>
                        <span>一键单据生成</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-header">
                <div class="login-title">欢迎回来</div>
                <div class="login-subtitle">请登录您的账户以继续</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名"
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-input" placeholder="请输入密码"
                            autocomplete="current-password">
                    </div>
                </div>

                <div class="form-footer">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe" class="checkbox-input">
                        <label for="rememberMe" class="checkbox-label">记住我</label>
                    </div>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <div id="alert" class="alert"></div>

                <button type="submit" id="loginButton" class="login-button">
                    登录
                </button>
            </form>

            <p class="default-account-tip">
                默认账户：admin / admin123
            </p>

            <div id="db-status-container" class="db-status-container">
                <div class="db-status-header">
                    <span style="font-weight: 600; display: flex; align-items: center; gap: 4px;">
                        <span>🗄️</span> 数据库连接
                    </span>
                    <span id="db-connection-badge" style="padding: 2px 8px; border-radius: 10px; background: #f3f4f6; color: #6b7280; font-size: 10px; flex-shrink: 0; font-weight: 600;">正在连接...</span>
                </div>
                <div id="db-path-text" class="db-status-path">正在获取数据库路径...</div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/entries/login.js"></script>
</body>

</html>
