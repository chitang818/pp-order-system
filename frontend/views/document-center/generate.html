<section id="view-document-center-generate" class="panel" data-view>

          <button class="type-btn active" data-type="invoice" title="商业发票">📄 发票（IV）</button>
          <button class="type-btn" data-type="packing" title="装箱单">📦 装箱单（PL）</button>
          <button class="type-btn" data-type="pickup" title="拉货通知">🚚 拉货通知</button>
        </div>
      </div>

          <button class="action-btn success" id="btnExportExcel" title="导出Excel">
            <span class="icon">📊</span>Excel
          </button>
        </div>
      </div>
    </div>
    
    <!-- 主工作区域 -->
    <div class="generate-main-area">
      <!-- 左侧：订单信息面板 -->
      <div class="order-info-panel" id="orderInfoPanel">

          <button class="panel-toggle" id="toggleOrderPanel" title="折叠/展开">
            <span class="icon">◀</span>
          </button>
        </div>

            </div>
            <div class="selection-control-item">

        </div>
