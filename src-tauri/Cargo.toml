[package]
name = "pp-order-management"
version = "2.0.3"
description = "PP订单管理系统"
authors = ["Your Company"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [], default-features = false }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24.0"
time = { version = "0.3", features = ["formatting"] }
rand = "0.8"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[profile.dev]
incremental = true

[profile.release]
incremental = false
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
